<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #833ab4;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #833ab4;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #833ab4, #fd1d1d);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        .info {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            My Social
        </div>

        <p class="subtitle">
            Demo Login
        </p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter demo password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="info">
            This is a demo login. Your password is not stored or sent anywhere.
        </p>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            // Demo validation only
            if (username.length > 0 && password.length > 0) {

                message.style.color = "green";
                message.innerText =
                    "Login successful! Opening Instagram...";

                setTimeout(function() {

                    // Opens Instagram's official website
                    window.location.href =
                        "https://www.instagram.com/";

                }, 1000);

            } else {

                message.style.color = "red";
                message.innerText =
                    "Please enter both fields.";

            }

        });

    </script>

</body>
</html>
